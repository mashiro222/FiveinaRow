name: Test and build desktop apps
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build and smoke-test standalone room service
        run: |
          docker build -f server/Dockerfile -t yijian-rooms .
          docker run -d --name room-smoke -p 127.0.0.1:8787:8787 yijian-rooms
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8787/health; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8787/health
          docker stop room-smoke
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-latest
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore compiled engine
        id: rapfi-cache
        uses: actions/cache/restore@v4
        with:
          path: native/rapfi
          key: rapfi-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('scripts/build-engine.mjs', 'third_party/rapfi/**') }}
      - name: Build pinned Rapfi with pretrained NNUE models
        if: steps.rapfi-cache.outputs.cache-hit != 'true'
        run: pnpm build:engine --arch=${{ matrix.arch }}
      - name: Cache compiled engine
        if: steps.rapfi-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native/rapfi
          key: ${{ steps.rapfi-cache.outputs.cache-primary-key }}
      - name: Native neural engine tests
        if: matrix.platform == 'win' || matrix.arch == 'arm64'
        run: pnpm test:native
      - name: Prepare Electron desktop runtime
        if: matrix.platform == 'win' || matrix.arch == 'arm64'
        run: node scripts/ensure-electron.cjs
      - name: Offline desktop UI tests
        if: matrix.platform == 'win' || matrix.arch == 'arm64'
        run: pnpm test:ui
      - name: Opening study UI tests
        if: matrix.platform == 'win' || matrix.arch == 'arm64'
        run: pnpm test:study
      - name: Piece alignment UI tests
        if: matrix.platform == 'win' || matrix.arch == 'arm64'
        run: pnpm test:appearance
      - name: Three-client online desktop tests
        if: matrix.platform == 'win' || matrix.arch == 'arm64'
        run: pnpm test:online
      - run: pnpm exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify macOS bundle signature
        if: matrix.platform == 'mac'
        shell: bash
        run: codesign --verify --deep --strict "release/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/Five in a Row.app"
      - uses: actions/upload-artifact@v4
        with:
          name: Five-in-a-Row-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
          body: |
            弈间 ${{ github.ref_name }} · Rapfi 分支棋谱与棋子对齐修复。

            26 种开局的第 4–6 手改为全力 Rapfi 分析，禁手与自由规则分别计算，提供筛选后的多条六手以内变化。棋盘候选可点击，手顺可逐步查看；接着练习沿用当前规则，并可选陪练或全力 Rapfi。分析是有限搜索结果，不是唯一最优解或必胜证明。

            修复草稿纸 O / X 棋子偏离交叉点：使用居中矢量图形，适配 13 / 15 / 19 路和不同窗口大小；草稿纸棋谱也显示手数。

            支持四位房间号、两个取名棋手席位与旁观席。房主设置黑棋禁手及每手 30 秒 / 60 秒 / 2 分钟，双方准备后开局。支持超时判负、断线重连、再来一局和空房间自动清理。

            Rapfi 在本机更新黑白胜率估计，可隐藏。原有离线人机、同屏双人、棋谱、主题和战绩保留。

            已内置免费公共棋室：打开「联机房间」，创建房间或输入四位房号即可异地游玩。旧版保存过局域网地址时点击「使用公共棋室」。首次唤醒可能需要约一分钟，游戏自动等待和重试；免费服务重启会清空房间。也保留自建与局域网服务。使用说明见仓库 docs/ONLINE.md。

            - mac-arm64：Apple Silicon Mac（M 系列芯片）
            - mac-x64：Intel Mac
            - win-x64：Windows 64 位；安装版和便携版

            此版本未经过 Apple 公证和 Windows 代码签名，首次运行可能需要在系统安全设置中允许打开。
