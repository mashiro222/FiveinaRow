name: Test and build desktop apps
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-latest
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build pinned Rapfi with pretrained NNUE models
        run: pnpm build:engine --arch=${{ matrix.arch }}
      - name: Native neural engine tests
        if: matrix.platform == 'win' || matrix.arch == 'arm64'
        run: pnpm test:native
      - name: Native desktop UI tests
        if: matrix.platform == 'win' || matrix.arch == 'arm64'
        run: pnpm test:ui
      - run: pnpm exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify macOS bundle signature
        if: matrix.platform == 'mac'
        shell: bash
        run: codesign --verify --deep --strict "release/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/Five in a Row.app"
      - uses: actions/upload-artifact@v4
        with:
          name: Five-in-a-Row-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
          body: |
            弈间 v1.1.0 · Rapfi 神经网络引擎升级。

            移除旧版四档 AI，接入 Rapfi 官方预训练 Mix9SVQ NNUE 模型。完全离线、全力搜索，支持每手 10 / 30 / 60 秒思考预算。提示和开局练习共用新引擎。旧战绩保留，与 Rapfi 胜率分开统计。

            自由规则支持 13 / 15 / 19 路；Rapfi 禁手模型使用 15 路棋盘。引擎 GPL 源码和许可随安装包提供。

            - mac-arm64：Apple Silicon Mac（M 系列芯片）
            - mac-x64：Intel Mac
            - win-x64：Windows 64 位；安装版和便携版

            此版本未经过 Apple 公证和 Windows 代码签名，首次运行可能需要在系统安全设置中允许打开。
